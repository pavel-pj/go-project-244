name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
            go test -v -coverprofile=coverage.out -covermode=atomic ./...
            # Конвертируем пути из module-path в относительные
            sed -i 's|github.com/unlaudd/go-project-244/||g' coverage.out


      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=go-project-244
            -Dsonar.organization=Lion-King240
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**,**/bin/**
            -Dsonar.go.coverage.reportPaths=coverage.out